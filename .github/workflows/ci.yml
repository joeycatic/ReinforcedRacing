name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make setup
      - run: make test
      - run: make web-build
      - run: npx --prefix web playwright install --with-deps chromium
      # Keep this hardware-dependent benchmark mandatory in the full local suite.
      - run: npm run test:e2e --prefix web -- --grep-invert '(^| )render frame timing during live inference$'
      - run: npm run test:static --prefix web
