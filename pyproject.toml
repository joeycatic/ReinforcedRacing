[project]
name = "racing-rl"
version = "0.1.0"
description = "Deterministic arcade racing simulation and batched RL environments"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.1,<2",
    "numpy>=2.1,<3",
    "pygame>=2.6,<3",
    "pyyaml>=6,<7",
    "tensorboard>=2.18,<3",
    "torch>=2.5,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
